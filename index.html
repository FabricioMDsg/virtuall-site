<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VirtuAll — Filmes, 3D e VFX com direção criativa e IA</title>
<meta name="description" content="Direção criativa e produção de filmes, 3D e VFX com IA para marcas, agências e produtoras. Fabrício Dresch, 20 anos de campanhas. Lajeado/RS." />
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Inter+Tight:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

:root {
  --paper:        #F6F5F1;
  --paper-pure:   #FFFFFF;
  --ink:          #0A0A0A;
  --ink-pure:     #000000;
  --neutral-50:   #F1F0EC;
  --neutral-100:  #E6E5E0;
  --neutral-200:  #CFCEC8;
  --neutral-300:  #B0AFA9;
  --neutral-400:  #8B8A85;
  --neutral-500:  #6B6A66;
  --neutral-600:  #4E4D4A;
  --neutral-700:  #353431;
  --neutral-800:  #1F1F1D;
  --neutral-900:  #121211;
  --signal-rec:   #E5322A;

  --fg-1:           var(--ink);
  --fg-2:           var(--neutral-700);
  --fg-3:           var(--neutral-500);
  --fg-inverse-1:   var(--paper);
  --fg-inverse-3:   var(--neutral-400);

  --line-1:         var(--neutral-200);
  --line-2:         var(--neutral-300);
  --line-strong:    var(--ink);
  --line-inverse-1: var(--neutral-700);

  --font-sans:  'Inter Tight', 'Inter', 'Helvetica Neue', Arial, sans-serif;
  --font-mono:  'JetBrains Mono', 'IBM Plex Mono', Menlo, monospace;

  --ease-cut: cubic-bezier(0.2, 0, 0.1, 1);
  --dur-1: 80ms; --dur-2: 160ms; --dur-3: 240ms;

  --radius-1: 2px; --radius-pill: 999px;
  --shadow-inset-strong: inset 0 0 0 1.5px var(--line-strong);

  --maxw-bleed: 1680px; --maxw-content: 1120px;
  --nav-h: 58px;
}

html { scroll-behavior: smooth; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--paper); color: var(--fg-1); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
button, input, textarea { font-family: inherit; }
a { color: inherit; text-decoration: none; transition: opacity var(--dur-1) var(--ease-cut); }
a:hover { opacity: 0.6; }
p { margin: 0; }

/* scroll-margin so sticky nav doesn't cover section titles */
section[id], #servicos { scroll-margin-top: var(--nav-h); }

/* layout helpers */
.bleed   { max-width: var(--maxw-bleed);    margin: 0 auto; padding: 0 32px; }
.content { max-width: var(--maxw-content);  margin: 0 auto; padding: 0 32px; }

/* ── Nav ─────────────────────────────────────────────────── */
.va-nav {
  position: sticky; top: 0; z-index: 50;
  background: rgba(246,245,241,0.82);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line-1);
  transition: background var(--dur-2) var(--ease-cut), border-color var(--dur-2);
  height: var(--nav-h);
}
.va-nav.dark {
  background: rgba(10,10,10,0.72);
  border-bottom-color: var(--line-inverse-1);
  color: var(--paper);
}
.va-nav-inner {
  display: flex; align-items: center; justify-content: space-between;
  height: 100%; padding: 0 32px;
}
.va-nav-mark {
  font-family: var(--font-sans); font-weight: 900; font-size: 20px;
  letter-spacing: -0.04em; cursor: pointer;
}
.va-nav-links { display: flex; gap: 28px; }
.va-nav-link {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.18em;
  text-transform: uppercase; cursor: pointer; padding: 6px 0; position: relative;
}
.va-nav-link.active::after {
  content:''; position:absolute; left:0; right:0; bottom:-2px;
  height:1px; background:currentColor;
}
.va-nav-lang { display:inline-flex; align-items:center; gap:4px; }
.va-lang-btn { background:none; border:none; cursor:pointer; font-family:var(--font-mono); font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:inherit; opacity:0.35; padding:0; transition:opacity var(--dur-2); }
.va-lang-btn.active { opacity:1; }
.va-lang-btn:hover { opacity:0.7; }
.va-lang-sep { font-family:var(--font-mono); font-size:11px; opacity:0.2; }

/* ── Hero: vídeo de fundo em tela cheia ─────────────────── */
.va-hero {
  position: relative;
  height: 100vh; height: 100svh;
  min-height: 560px;
  margin-top: calc(-1 * var(--nav-h));
  background: var(--ink);
  color: var(--paper);
  overflow: hidden;
}
.va-hero-video {
  position: absolute; inset: 0; z-index: 0;
  width: 100%; height: 100%; object-fit: cover;
}
.va-hero::before {
  content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background: linear-gradient(to top, rgba(0,0,0,.75), rgba(0,0,0,.2));
}
.va-hero::after {
  content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background-image: radial-gradient(rgba(0,0,0,.9) 1px, transparent 1.6px);
  background-size: 6px 6px;
}
.va-hero-bar {
  position: absolute; top: var(--nav-h); left: 0; right: 0; z-index: 2;
  height: 44px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 32px;
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--neutral-300);
}
.va-rec { display: inline-flex; align-items: center; gap: 6px; }
.va-rec-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--signal-rec); animation: blink 1s infinite linear; }
@keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0.2} }

.va-hr-content {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
  padding: 0 48px 48px;
  display: flex; align-items: flex-end; justify-content: space-between; gap: 32px;
}
.va-hr-eyebrow {
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.18em; text-transform: uppercase; color: var(--neutral-300);
  margin-bottom: 24px;
}
.va-hr-title {
  position: relative; z-index: 2;
  font-family: var(--font-sans); font-weight: 900;
  font-size: clamp(3.5rem, 11vw, 11rem);
  line-height: .9; letter-spacing: -.03em; color: var(--paper); margin: 0;
}
.va-scroll-cta { flex-shrink: 0; }
.va-scroll-cta a {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  width: 56px; height: 56px; border-radius: 50%;
  border: 1.5px solid rgba(246,245,241,0.3);
  color: var(--neutral-200); text-decoration: none;
  transition: border-color 0.25s, color 0.25s, background 0.25s;
}
.va-scroll-cta a:hover {
  border-color: rgba(246,245,241,0.7);
  color: var(--paper);
  background: rgba(246,245,241,0.07);
}
.va-scroll-arrows { display: flex; flex-direction: column; align-items: center; animation: va-bounce 1.6s ease-in-out infinite; }
@keyframes va-bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(5px); } }

/* ── Section common ──────────────────────────────────────── */
.va-sec-eyebrow {
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.18em; text-transform: uppercase; color: var(--fg-3);
}
.va-sec-head {
  font-family: var(--font-sans); font-weight: 900;
  font-size: clamp(36px, 5vw, 72px);
  line-height: 0.95; letter-spacing: -0.03em;
  margin: 0;
}
.va-body {
  font-family: var(--font-sans); font-size: 16px;
  font-weight: 400; line-height: 1.55; color: var(--fg-2);
}

/* ── Serviços — 3 blocos de impacto ─────────────────────── */
.va-svc-blk {
  padding: 96px 0;
  border-bottom: 1px solid var(--line-1);
}
.va-svc-blk.inv {
  background: var(--ink);
  color: var(--paper);
  border-bottom-color: var(--line-inverse-1);
}
.va-svc-blk-inner {
  max-width: var(--maxw-content);
  margin: 0 auto; padding: 0 32px;
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 80px; align-items: center;
}
.va-svc-blk.inv .va-svc-blk-inner { direction: rtl; }
.va-svc-blk.inv .va-svc-blk-text,
.va-svc-blk.inv .va-svc-blk-img,
.va-svc-blk.inv .va-svc-list { direction: ltr; }
.va-svc-blk-eyebrow {
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--fg-3); margin-bottom: 20px;
}
.va-svc-blk.inv .va-svc-blk-eyebrow { color: var(--neutral-500); }
.va-svc-blk-headline {
  font-family: var(--font-sans); font-weight: 900;
  font-size: clamp(48px, 6.5vw, 76px);
  line-height: 0.93; letter-spacing: -0.04em;
  color: var(--fg-1); margin: 0 0 32px;
}
.va-svc-blk.inv .va-svc-blk-headline { color: var(--paper); }
.va-svc-blk-desc {
  font-family: var(--font-sans); font-size: 16px;
  line-height: 1.6; color: var(--fg-2); max-width: 420px;
}
.va-svc-blk.inv .va-svc-blk-desc { color: var(--neutral-400); }
.va-svc-blk-img {
  aspect-ratio: 3/2; background: var(--neutral-100);
  border: 1px solid var(--line-1);
  display: flex; align-items: center; justify-content: center;
}
.va-svc-blk.inv .va-svc-blk-img {
  background: var(--neutral-800);
  border-color: var(--line-inverse-1);
}
.va-svc-blk-img-label {
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--neutral-400);
}
.va-svc-blk.inv .va-svc-blk-img-label { color: var(--neutral-600); }
.va-svc-list {
  display: flex; flex-direction: column;
  align-self: stretch;
  border-top: 1px solid var(--line-1);
}
.va-svc-list-item {
  flex: 1; display: flex; flex-direction: column; justify-content: center;
  gap: 5px; border-bottom: 1px solid var(--line-1);
  padding: 0 0 0 4px;
}
.va-svc-list-name {
  font-family: var(--font-sans); font-weight: 700;
  font-size: 18px; letter-spacing: -0.02em; color: var(--fg-1);
}
.va-svc-list-apps {
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-3);
}

.va-svc-blk.inv .va-svc-list,
.va-svc-blk.inv .va-svc-list-item { border-color: var(--line-inverse-1); }
.va-svc-blk.inv .va-svc-list-name { color: var(--paper); }
.va-svc-blk.inv .va-svc-list-apps { color: var(--neutral-500); }

/* ── Vetezando ───────────────────────────────────────────── */
.va-sec-vetezando {
  padding: 96px 0;
  background: var(--ink); color: var(--paper);
  border-bottom: 1px solid var(--line-inverse-1);
}
.va-vetezando-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; margin-top: 56px; align-items: center; }

/* ── Portfólio ───────────────────────────────────────────── */
.va-sec-portfolio {
  padding: 96px 0 64px;
  background: var(--ink);
  color: var(--paper);
  border-bottom: 1px solid var(--neutral-700);
  --fg-1: var(--paper);
  --fg-2: var(--neutral-300);
  --fg-3: var(--neutral-400);
  --line-1: var(--neutral-700);
}
.va-port-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; margin-top: 56px; }
.va-port-card { display: block; cursor: default; }
.va-port-still { aspect-ratio: 16/9; background: var(--neutral-800); position: relative; overflow: hidden; }
.va-port-still img { width:100%; height:100%; object-fit:cover; transition: transform var(--dur-3) var(--ease-cut); }
.va-port-card:hover .va-port-still img { transform: scale(1.02); }
.va-port-corner {
  position: absolute; top:12px; left:12px; right:12px;
  display: flex; justify-content: space-between;
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.18em;
  text-transform: uppercase; color: rgba(255,255,255,0.8);
}
.va-port-meta {
  padding: 12px 0; border-bottom: 1px solid var(--line-1);
  display: flex; justify-content: space-between; align-items: baseline;
}
.va-port-client {
  font-family: var(--font-sans); font-weight: 800; font-size: 24px;
  letter-spacing: -0.03em;
}
.va-port-year {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--fg-3);
}

/* ── Sobre ───────────────────────────────────────────────── */
.va-sec-about { padding: 96px 0; border-bottom: 1px solid var(--line-1); }
.va-about-grid { display: grid; grid-template-columns: 5fr 7fr; gap: 80px; margin-top: 56px; align-items: end; }
.va-about-photo {
  aspect-ratio: 4/5; background: var(--neutral-100); border: 1px solid var(--line-1);
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.va-about-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.va-about-lines { margin-top: 32px; max-width: 520px; }
.va-about-lines .va-body { font-size: 19px; margin: 0 0 14px; color: var(--fg-1); }

/* ── Contato ─────────────────────────────────────────────── */
.va-sec-contact { padding: 96px 0; }
.va-contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 96px; margin-top: 56px; }
.va-contact-info-block { margin-top: 48px; padding-top: 28px; border-top: 1px solid var(--ink); }

.va-field { display:flex; flex-direction:column; gap:6px; margin-bottom:18px; }
.va-field label { font-family:var(--font-mono); font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:var(--fg-3); }
.va-input {
  font-family:var(--font-sans); font-size:15px; padding:13px 16px;
  background:var(--paper); border:1px solid var(--line-2); border-radius:var(--radius-1);
  color:var(--fg-1); outline:none; transition:border-color var(--dur-2);
  width: 100%;
}
.va-input:focus { border-color:var(--ink); box-shadow:0 0 0 1px var(--ink); }
.va-btn-primary {
  font-family:var(--font-sans); font-weight:700; font-size:14px; letter-spacing:-0.01em;
  padding:14px 32px; cursor:pointer; border:0;
  background:var(--ink); color:var(--paper); border-radius:var(--radius-pill);
  display:inline-flex; align-items:center; gap:8px;
  transition: background var(--dur-2), color var(--dur-2), box-shadow var(--dur-2);
}
.va-btn-primary:hover { background:var(--paper); color:var(--ink); box-shadow:var(--shadow-inset-strong); opacity:1; }
.va-btn-ghost {
  font-family:var(--font-sans); font-weight:700; font-size:14px;
  padding:0; cursor:pointer; border:0; background:transparent; color:var(--ink);
  display:inline-flex; align-items:center; gap:6px;
  transition:opacity var(--dur-1);
}
.va-btn-ghost:hover { opacity:0.6; }

.va-sent {
  display:flex; flex-direction:column; justify-content:center;
  padding:48px; box-shadow:var(--shadow-inset-strong);
  min-height: 360px;
}
.va-sent-head {
  font-family:var(--font-sans); font-weight:900; font-size:52px;
  line-height:0.9; letter-spacing:-0.04em; margin:16px 0 28px;
}

/* ── Footer ──────────────────────────────────────────────── */
.va-footer {
  background:var(--ink); color:var(--paper);
  padding:96px 32px 80px; text-align:center;
}
.va-footer-mark {
  font-family:var(--font-sans); font-weight:900;
  font-size:clamp(36px, 5vw, 72px);
  line-height:0.95; letter-spacing:-0.03em; color:var(--paper);
  display:block; margin-bottom:48px;
}
.va-footer-col {
  display:flex; flex-direction:column; align-items:center; gap:12px;
}
.va-footer-col a {
  display:inline-flex; align-items:center; gap:8px;
  font-size:15px; color:var(--neutral-300);
}
.va-footer-col a:hover { opacity:0.6; }

/* ── Responsive ──────────────────────────────────────────── */
@media (max-width: 768px) {
  .va-nav-links { display: none; }
  .va-hero-bar { padding: 0 20px; }
  .va-hero-bar .va-hero-tc { display: none; }
  .va-hr-content { padding: 0 20px 28px; }
  .va-scroll-cta { display: none; }
  .va-svc-blk-inner { grid-template-columns: 1fr; gap: 40px; }
  .va-svc-blk.inv .va-svc-blk-inner { direction: ltr; }
  .va-svc-blk-text { order: 1; }
  .va-svc-blk-img  { order: 2; }
  .va-svc-list { order: 2; }
  .va-svc-list-item { padding: 14px 0 14px 4px; }
  .va-about-photo { max-width: 280px; }
  .va-vetezando-grid,
  .va-about-grid,
  .va-contact-grid { grid-template-columns: 1fr; gap: 48px; }
  .va-port-grid { grid-template-columns: 1fr; }
  .bleed, .content { padding: 0 20px; }
  .va-footer { padding: 64px 20px 48px; }
}
@media (prefers-reduced-motion: reduce) {
  .va-rec-dot, .va-scroll-arrows { animation: none; }
}
</style>
</head>

// ─── HeroReel: vídeo de fundo em tela cheia ───────────────
// Arquivo próprio, mp4 até ~5 MB (H.264, sem áudio). Trocar aqui.
const HERO_VIDEO  = 'assets/hero/hero.mp4';
const HERO_POSTER = 'assets/hero/hero-poster.jpg';

function HeroReel({ lang }) {
  const [tc, setTc] = useState('00:01:24:18');

  useEffect(() => {
    let frame = 18 + 24*24 + 60*24;
    const id = setInterval(() => {
      frame = (frame + 1) % (60 * 60 * 24);
      const h = String(Math.floor(frame / (60*60*24))).padStart(2,'0');
      const m = String(Math.floor((frame % (60*60*24)) / (60*24))).padStart(2,'0');
      const s = String(Math.floor((frame % (60*24)) / 24)).padStart(2,'0');
      const f = String(frame % 24).padStart(2,'0');
      setTc(`${h}:${m}:${s}:${f}`);
    }, 1000/24);
    return () => clearInterval(id);
  }, []);

  // iOS/Chrome só fazem autoplay se o elemento estiver de fato mudo
  const videoRef = useRef(null);
  useEffect(() => {
    const v = videoRef.current;
    if (!v) return;
    v.muted = true; v.defaultMuted = true;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { v.pause(); return; }
    const p = v.play(); if (p && p.catch) p.catch(() => {});
  }, []);

  const t = STRINGS[lang].hero;
  return e('section', { id:'hero', className:'va-hero' },
    e('video', {
      ref: videoRef, className:'va-hero-video',
      src: HERO_VIDEO, poster: HERO_POSTER,
      autoPlay:true, muted:true, loop:true, playsInline:true, preload:'auto',
      'aria-hidden':'true', tabIndex:-1,
    }),
    e('div', { className:'va-hero-bar' },
      e('span', null, 'VirtuAll · VFX'),
      e('span', { className:'va-rec' }, e('span', { className:'va-rec-dot' }), ' ' + t.live),
      e('span', { className:'va-hero-tc' }, `${tc} / 00:03:42:00`)
    ),
    e('div', { className:'va-hr-content' },
      e('div', { className:'va-hr-left' },
        e('div', { className:'va-hr-eyebrow' }, t.eyebrow),
        e('h1', { className:'va-hr-title' },
          t.t1, e('br'), t.t2, e('br'), t.t3)
      ),
      e('div', { className:'va-scroll-cta' },
        e('a', { href:'#servicos', 'aria-label': lang==='en' ? 'Scroll down' : 'Rolar para baixo' },
          e('div', { className:'va-scroll-arrows' },
            e('svg', { width:24, height:14, viewBox:'0 0 24 14', fill:'none', stroke:'currentColor', strokeWidth:2, strokeLinecap:'round', strokeLinejoin:'round' },
              e('polyline', { points:'2 2 12 12 22 2' })
            ),
            e('svg', { width:24, height:14, viewBox:'0 0 24 14', fill:'none', stroke:'currentColor', strokeWidth:2, strokeLinecap:'round', strokeLinejoin:'round', style:{opacity:0.35} },
              e('polyline', { points:'2 2 12 12 22 2' })
            )
          )
        )
      )
    )
  );
}

function Contato({ lang }) {
  const t = STRINGS[lang].contact;

  const [sent, setSent] = useState(false);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const upd = (k, v) => setForm(f => ({ ...f, [k]:v }));

  const handleSubmit = (ev) => {
    ev.preventDefault();
    setLoading(true);
    setError('');
    fetch('https://formspree.io/f/xvzlwaaj', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({ name: form.name, email: form.email, empresa: form.company, briefing: form.brief }),
    })
      .then(res => res.json())
      .then(data => {
        if (data.ok) { setSent(true); }
        else { setError(t.errGeneric); }
      })
      .catch(() => setError(t.errNetwork))
      .finally(() => setLoading(false));

  return e('section', { id:'contato', className:'va-sec-contact' },
    e('div', { className:'content' },
      e('div', { className:'va-sec-eyebrow' }, t.eyebrow),

            e('a', { href:'https://wa.me/5548991111727', target:'_blank', className:'va-body', style:{marginTop:8, display:'block'} }, 'WhatsApp (48) 9 9111-1727')
          )
        ),
        sent
          ? e('div', { className:'va-sent' },
              e('div', { style:{fontFamily:'var(--font-mono)', fontSize:11, letterSpacing:'0.18em', textTransform:'uppercase', color:'var(--fg-3)'} }, t.okEyebrow),

              e('button', { className:'va-btn-ghost', onClick:() => { setSent(false); setForm({ name:'', email:'', company:'', brief:'' }); } }, t.okReset)
            )
          : e('form', { onSubmit: handleSubmit },

                e('label', null, t.lName),
                e('input', { className:'va-input', value:form.name, onChange:ev => upd('name', ev.target.value), placeholder:t.phName, required:true })
              ),
              e('div', { className:'va-field' },
                e('label', null, t.lEmail),
                e('input', { className:'va-input', type:'email', value:form.email, onChange:ev => upd('email', ev.target.value), placeholder:t.phEmail, required:true })
              ),
              e('div', { className:'va-field' },

// ─── App ─────────────────────────────────────────────────────
function App() {
  const [darkNav, setDarkNav] = useState(true);
  const [lang, setLang] = useState(() => {
    const saved = localStorage.getItem('va-lang');
    if (saved) return saved;
    return (navigator.language || '').toLowerCase().startsWith('pt') ? 'pt' : 'en';
  });
  const switchLang = (l) => { setLang(l); localStorage.setItem('va-lang', l); };
  const heroRef = useRef(null);

  useEffect(() => {
    const hero = document.getElementById('hero');
    if (!hero) return;
    const obs = new IntersectionObserver(
      ([entry]) => setDarkNav(entry.isIntersecting),
      { threshold: 0.1 }
    );
    obs.observe(hero);
    return () => obs.disconnect();
  }, []);

  return e(React.Fragment, null,
    e(Nav, { dark:darkNav, lang, switchLang }),
    e(HeroReel, { lang }),
    e(Servicos, { lang }),
    e(Portfolio, { lang }),
    e(Sobre, { lang }),
    e(Contato, { lang }),
    e(Footer)
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(e(App));
